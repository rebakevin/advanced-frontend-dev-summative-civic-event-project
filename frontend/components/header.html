<header class="site-header dark">
  <div class="site-header-inner">
    <a class="header-logo" href="{{root}}events/" aria-label="CivicEvents home">
      <img class="header-logo-mark" src="{{root}}assets/logo.png" alt="" width="36" height="36">
      <span class="header-logo-text">CivicEvents</span>
    </a>

    <div class="header-actions" id="header-actions">
      <button type="button" class="header-icon-btn" id="notif-bell" aria-label="Notifications" aria-haspopup="dialog">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="header-badge" id="notif-count" aria-live="polite" hidden>0</span>
      </button>

      <div class="dropdown header-profile" id="profile-dropdown">
        <button type="button" class="dropdown-trigger header-profile-trigger" id="profile-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="profile-menu">
          <span class="header-avatar" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          </span>
          <span class="header-user-name" id="header-user-name">Account</span>
          <svg class="header-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="dropdown-menu" id="profile-menu" role="menu" aria-labelledby="profile-trigger">
          <a class="dropdown-item" role="menuitem" href="{{root}}profile/">Profile</a>
          <a class="dropdown-item" role="menuitem" href="{{root}}my-registrations/">My registrations</a>
          <a class="dropdown-item" role="menuitem" href="{{root}}my-dashboard/">My dashboard</a>
          <div class="dropdown-sep" role="separator"></div>
          <button type="button" class="dropdown-item" role="menuitem" id="logout-btn">Logout</button>
        </div>
      </div>

      <button type="button" class="header-icon-btn header-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="header-menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>

    <div class="header-menu" id="header-menu">
      <form class="header-search" id="header-search" role="search" method="get" action="{{root}}events/">
        <div class="search-input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" name="q" placeholder="Search events" aria-label="Search events" autocomplete="off">
        </div>
      </form>

      <nav class="header-nav" id="primary-nav" aria-label="Main">
        <!-- ROLE GUARD: each role gets one Dashboard link, first in the nav. guard.js removes the one that does not apply. The backend enforces the real permission. -->
        <a class="header-link" href="{{root}}my-dashboard/" data-role="user" data-match="my-dashboard">Dashboard</a>
        <a class="header-link" href="{{root}}admin-dashboard/" data-role="admin" data-match="admin-dashboard admin-users admin-notifications">Dashboard</a>
        <a class="header-link" href="{{root}}events/" data-match="events event-detail">Events</a>
        <a class="header-link" href="{{root}}announcements/" data-match="announcements announcement-detail">Announcements</a>
        <a class="header-link" href="{{root}}promos/" data-match="promos">Promos</a>
              </nav>
    </div>
  </div>
</header>

<div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>
<aside class="drawer" id="notif-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
  <div class="drawer-header">
    <h2 class="drawer-title" id="drawer-title">Notifications</h2>
    <button type="button" class="drawer-close" id="drawer-close" aria-label="Close notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <ul class="drawer-list" id="drawer-list">
    <li class="drawer-empty">No notifications yet.</li>
  </ul>
  <div class="drawer-footer">
    <a class="btn btn-secondary" href="{{root}}notifications/">View all</a>
  </div>
</aside>
